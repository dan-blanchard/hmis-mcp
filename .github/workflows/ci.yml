name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run pytest -q

  bundle:
    name: Claude Desktop bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 scripts/build_bundle.py build/bundle
      - run: npx --yes @anthropic-ai/mcpb@2.1.2 validate build/bundle
      - run: npx --yes @anthropic-ai/mcpb@2.1.2 pack build/bundle hmis-mcp.mcpb
      - uses: actions/upload-artifact@v4
        with:
          name: hmis-mcp.mcpb
          path: hmis-mcp.mcpb

  package:
    # Install the built wheel the way an end user would and run it.
    name: install from wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - name: Run the installed command
        run: |
          wheel=$(ls dist/*.whl)
          uvx --from "$wheel" hmis-mcp sample sample-export
          uvx --from "$wheel" hmis-mcp check --export sample-export
          for v in 2022 2024; do
            uvx --from "$wheel" hmis-mcp sample "sample-$v" --csv-version "$v"
            uvx --from "$wheel" hmis-mcp check --export "sample-$v"
          done
