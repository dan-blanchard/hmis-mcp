name: Release

# Publishing a GitHub release uploads that version to PyPI using trusted
# publishing: PyPI checks that the upload comes from this workflow in this
# repository, so no API token is stored anywhere.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Tag must match the package version
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "v$version" = "$GITHUB_REF_NAME" || {
            echo "Release tag $GITHUB_REF_NAME does not match pyproject version $version (expected v$version)"
            exit 1
          }
      - run: uv sync
      - run: uv run pytest -q
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  bundle:
    # Attach the Claude Desktop bundle to the release under a fixed name, so
    # releases/latest/download/hmis-mcp.mcpb always points at the newest one.
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 scripts/build_bundle.py build/bundle
      - run: npx --yes @anthropic-ai/mcpb@2.1.2 pack build/bundle hmis-mcp.mcpb
      - run: gh release upload "$GITHUB_REF_NAME" hmis-mcp.mcpb --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
