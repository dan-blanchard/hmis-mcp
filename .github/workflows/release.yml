name: Release

# Pushing a tag like v1.2.3 publishes that version: the package goes to PyPI
# and a GitHub release is created with the Claude Desktop bundle attached.
#
# PyPI uses trusted publishing: it checks that the upload comes from this
# workflow in this repository, so no API token is stored anywhere.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Tag must match the package version
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "v$version" = "$GITHUB_REF_NAME" || {
            echo "Tag $GITHUB_REF_NAME does not match pyproject version $version (expected v$version)"
            exit 1
          }
      - name: Tag must be on main
        run: |
          git fetch --quiet origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main"
            exit 1
          }
      - run: uv sync
      - run: uv run pytest -q
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 scripts/build_bundle.py build/bundle
      - run: npx --yes @anthropic-ai/mcpb@2.1.2 pack build/bundle hmis-mcp.mcpb
      - uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: hmis-mcp.mcpb

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    # Runs only once the package is on PyPI. The bundle keeps a fixed file name,
    # so releases/latest/download/hmis-mcp.mcpb always points at the newest one.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bundle
      - name: Create the release, using the tag's message as its notes
        run: |
          git fetch --quiet --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" hmis-mcp.mcpb \
            --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
